<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title description">
  <title id="title">CosmoEdge Connect: give your AI assistant a complete site task</title>
  <desc id="description">Illustrative workflow, not a client screenshot. A person delegates a complete task; the assistant organizes queries, images and a brief, returning originals and follow-up items. Camera video enters the deployed CosmoEdge system for video ingestion, continuous detection, and task, alarm and event management. CosmoEdge Connect runs on a local computer, connects to one deployed CosmoEdge device, and provides tools to the AI assistant through MCP. Device changes still require local user confirmation.</desc>
  <rect x="1" y="1" width="958" height="698" rx="20" fill="#f6f8fc" stroke="#d9e1ec" stroke-width="2"/>
