      <text x="598" y="164">02</text>
      <text x="902" y="164">03</text>
    </g>
    <g font-size="21" font-weight="650" letter-spacing="-.4">
      <text x="56" y="212">You delegate a task</text>
      <text x="360" y="212">Assistant organizes</text>
      <text x="664" y="212">Get the work back</text>
    </g>
    <g font-size="18.5" fill="#394d68">
      <text x="56" y="246"><tspan x="56">“Prepare a handover:</tspan><tspan x="56" dy="24">yesterday’s alarms,</tspan><tspan x="56" dy="24">and an image</tspan><tspan x="56" dy="24">from the East Gate.”</tspan></text>
      <text x="360" y="250"><tspan x="360">Query records. Get images.</tspan><tspan x="360" dy="28">Review and organize.</tspan><tspan x="360" dy="28">Flag items for people.</tspan></text>
      <text x="664" y="250"><tspan x="664">Brief and original files</tspan><tspan x="664" dy="28">Follow-up items</tspan><tspan x="664" dy="28">Questions for the team</tspan></text>
    </g>
    <g stroke="#e4eaf3" stroke-width="1.5">
      <path d="M56 332h240M360 332h240M664 332h240"/>
    </g>
    <g font-size="15" font-weight="600" fill="#24549e">
      <text x="56" y="360">Scope + expected deliverables</text>
      <text x="360" y="360">Less searching and copying</text>
      <text x="664" y="360">Review and handle exceptions</text>
    </g>
    <path d="M32 408h896" stroke="#d9e1ec" stroke-width="1.5"/>
    <text x="32" y="440" font-size="19" font-weight="600" fill="#394d68">Your existing CosmoEdge system supplies the records and images</text>

