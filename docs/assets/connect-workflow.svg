<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">CosmoEdge Connect: give your AI assistant a complete site task</title>
  <desc id="description">Illustrative workflow, not a client screenshot. Describe a complete task, its scope and expected deliverables. The assistant organizes queries, image requests and a brief, returning original files, follow-up items and questions for people to resolve. Device changes still require local user confirmation.</desc>
