      <text x="360" y="212">Assistant organizes</text>
      <text x="664" y="212">Get the work back</text>
    </g>
    <g font-size="18.5" fill="#394d68">
      <text x="56" y="246"><tspan x="56">“Prepare a handover:</tspan><tspan x="56" dy="24">yesterday’s alarms,</tspan><tspan x="56" dy="24">and an image</tspan><tspan x="56" dy="24">from the East Gate.”</tspan></text>
      <text x="360" y="250"><tspan x="360">Query records. Get images.</tspan><tspan x="360" dy="28">Review and organize.</tspan><tspan x="360" dy="28">Flag items for people.</tspan></text>
