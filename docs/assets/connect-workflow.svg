<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">CosmoEdge Connect: three ways to work with a device</title>
  <desc id="description">Illustrative workflow, not a client screenshot. Ask about yesterday's alarms and receive statistics and the original report. Request an original image of the loading bay and continue asking questions. Prepare to pause a detector while keeping its settings, then confirm locally and verify its state.</desc>
  <rect x="1" y="1" width="958" height="438" rx="20" fill="#f6f8fc" stroke="#d9e1ec" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" fill="#17263e">
    <path d="M34 29h13v13H34zM51 29h13v13H51zM34 46h13v13H34z" fill="#2563eb"/>
    <path d="M51 46h13v13H51z" fill="#8cb3fb"/>
    <text x="78" y="52" font-size="27" font-weight="700" letter-spacing="-.6">CosmoEdge Connect</text>
    <text x="34" y="89" font-size="18" fill="#536279">Three ways to work with your CosmoEdge device</text>

    <g fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5">
      <rect x="32" y="120" width="288" height="266" rx="14"/>
      <rect x="336" y="120" width="288" height="266" rx="14"/>
      <rect x="640" y="120" width="288" height="266" rx="14"/>
    </g>
    <g fill="none" stroke="#a3b4cc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M322 255h12m-4-4 4 4-4 4"/>
      <path d="M626 255h12m-4-4 4 4-4 4"/>
    </g>

    <g fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M59 146h18l7 7v24H59zM77 146v8h7M65 160h6M65 166h13M65 172h10"/>
      <rect x="362" y="148" width="31" height="26" rx="3"/>
      <circle cx="383" cy="155" r="2"/>
      <path d="m364 170 8-9 7 7 4-4 8 8"/>
      <path d="M668 150h28M668 161h28M668 172h28"/>
      <rect x="674" y="146" width="6" height="8" rx="2" fill="#ffffff"/>
      <rect x="687" y="157" width="6" height="8" rx="2" fill="#ffffff"/>
      <rect x="676" y="168" width="6" height="8" rx="2" fill="#ffffff"/>
    </g>
    <g font-size="15" font-weight="600" fill="#77869b" text-anchor="end">
      <text x="294" y="164">01</text>
      <text x="598" y="164">02</text>
      <text x="902" y="164">03</text>
    </g>
    <g font-size="21" font-weight="650" letter-spacing="-.4">
      <text x="56" y="212">Ask about records</text>
      <text x="360" y="212">Look at a source image</text>
      <text x="664" y="212">Confirm a change</text>
    </g>
    <g font-size="19.5" fill="#394d68">
      <text x="56" y="252"><tspan x="56">“Which sources had the</tspan><tspan x="56" dy="28">most alarms yesterday?”</tspan></text>
      <text x="360" y="252"><tspan x="360">“Show me the loading bay’s</tspan><tspan x="360" dy="28">original image.”</tspan></text>
      <text x="664" y="252"><tspan x="664">“Prepare to pause this</tspan><tspan x="664" dy="28">detector, keeping</tspan><tspan x="664" dy="28">its settings.”</tspan></text>
    </g>
    <g stroke="#e4eaf3" stroke-width="1.5">
      <path d="M56 332h240M360 332h240M664 332h240"/>
    </g>
    <g font-size="15" font-weight="600" fill="#24549e">
      <text x="56" y="360">Statistics + original report</text>
      <text x="360" y="360">Original image + follow-up</text>
      <text x="664" y="360">Confirm locally + verify state</text>
    </g>
    <text x="480" y="416" text-anchor="middle" font-size="14" fill="#63738b">Illustrative workflow · not a client screenshot</text>
  </g>
</svg>
